name: Daily Blog Post

on:
  schedule:
    # 13:00 UTC every day (~9:00 AM US Eastern). Adjust as you like.
    - cron: "0 13 * * *"
  workflow_dispatch: {} # lets you run it manually from the Actions tab

# Allow the workflow to commit the generated post back to the repo.
permissions:
  contents: write

concurrency:
  group: daily-blog
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate today's blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: set a repository variable ANTHROPIC_MODEL to override the model.
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: node scripts/generate-post.mjs

      - name: Verify the site builds (also regenerates sitemap.xml + rss.xml)
        run: npm run build

      - name: Commit and push the new post
        run: |
          git config user.name "skylift-blog-bot"
          git config user.email "skyliftgroupai@users.noreply.github.com"
          git add src/content/blog public/sitemap.xml public/rss.xml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(blog): automated daily post ($(date -u +%Y-%m-%d))"
          git push
