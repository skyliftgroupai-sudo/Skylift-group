<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- <link rel="icon" type="image/png" href="/assets/sky-lift.webp" /> -->

  <link rel="icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-64.png" />
  <!-- <link rel="icon" sizes="48x48" href="/public/favicon.png" /> -->
  <link rel="preload" as="image" href="/assets/services.webp" fetchpriority="high" />
  <link rel="preload" as="image" href="/assets/bg-hero.webp" fetchpriority="high" />


  <!-- No canonical here on purpose. scripts/prerender.mjs inserts a self-referencing
       canonical into each generated page, and useSeo re-applies it after hydration.
       A hardcoded homepage canonical in this template would make every route look
       like a duplicate of the homepage and suppress indexing site-wide. -->

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google-site-verification" content="V3qPjcDtjrSsBQu1t4pWiYQbJGDqd9zEWI5JM9nclhw" />

  <!-- These are template defaults. scripts/prerender.mjs overwrites the title,
       description, canonical, og:title, og:description, og:url and og:image on
       every generated page, so what ships here is only the fallback. Keep it
       accurate anyway — it is what a route with no seo-config entry would use.
       The old <meta name="keywords"> was removed: Google has ignored it since
       2009 and it carried the wrong "Skylift Group" spelling. -->
  <meta name="description"
    content="Sky Lift Group helps home service businesses get more leads with AI chatbots, missed-call text back, SMS marketing, ads, and local SEO." />

  <!-- Open Graph for Facebook, LinkedIn, WhatsApp -->
  <meta property="og:site_name" content="Sky Lift Group" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:title" content="AI Marketing & Automation for Local Business | Sky Lift Group" />
  <meta property="og:description"
    content="Sky Lift Group helps home service businesses get more leads with AI chatbots, missed-call text back, SMS marketing, ads, and local SEO." />
  <meta property="og:image" content="https://www.skyliftgroup.com/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Sky Lift Group logo" />
  <meta property="og:url" content="https://www.skyliftgroup.com/" />
  <meta property="og:type" content="website" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="AI Marketing & Automation for Local Business | Sky Lift Group" />
  <meta name="twitter:description"
    content="Sky Lift Group helps home service businesses get more leads with AI chatbots, missed-call text back, SMS marketing, ads, and local SEO." />
  <meta name="twitter:image" content="https://www.skyliftgroup.com/og-image.png" />

  <!-- No JSON-LD here on purpose. Every block is built in src/lib/schema.js and
       baked into each page by scripts/prerender.mjs as a single @graph, so the
       Organization entity has exactly one definition per page and @id references
       always resolve. A second hardcoded copy here would duplicate it. -->


  <title>Sky Lift Group</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- Third-party widgets are deferred so they never block first paint.
       Both are chat/booking UI that nobody can interact with before the page
       renders anyway, and together they were competing with the app bundle for
       bandwidth during the LCP window. -->

  <!-- AI Chat Boot Script -->
  <script defer src="https://widgets.leadconnectorhq.com/loader.js" data-resources-url="https://widgets.leadconnectorhq.com/chat-widget/loader.js" data-widget-id="6a4ec0f6d77eb8016d211bce" data-source="WEB_USER"></script>

  <!-- AI Calendar Script -->
  <script defer src="https://link.msgsndr.com/js/form_embed.js" type="text/javascript"></script>

</body>

</html>
