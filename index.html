  <!-- These are template defaults. scripts/prerender.mjs overwrites the title,

       accurate anyway — it is what a route with no seo-config entry would use.

  <!-- No JSON-LD here on purpose. Every block is built in src/lib/schema.js and
       baked into each page by scripts/prerender.mjs as a single @graph, so the
       Organization entity has exactly one definition per page and @id references
       always resolve. A second hardcoded copy here would duplicate it. -->


  <!-- Google Analytics 4 with Consent Mode v2.
       Ordering matters and is not accidental:
         1. the gtag stub and dataLayer exist first,
         2. consent defaults to DENIED for all four v2 signals,
         3. a previously granted choice is restored from localStorage,
         4. only then does the GA4 config call run,
         5. gtag.js itself loads async and replays whatever is queued.
       If the defaults were queued after the config call, the first hit of every
       session would go out under the wrong consent state.

       send_page_view is false: src/components/Layout.jsx sends one page_view per
       route instead, so client-side navigation is counted and the initial load
       is not counted twice. -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }

    gtag('consent', 'default', {
      ad_storage: 'denied',
      ad_user_data: 'denied',
      ad_personalization: 'denied',
      analytics_storage: 'denied',
      wait_for_update: 500
    });

    try {
      if (window.localStorage.getItem('slg-consent-v1') === 'granted') {
        gtag('consent', 'update', {
          ad_storage: 'granted',
          ad_user_data: 'granted',
          ad_personalization: 'granted',
          analytics_storage: 'granted'
        });
      }
    } catch (e) { /* storage blocked: defaults stand */ }

    gtag('js', new Date());
    gtag('config', 'G-L6KM3R8YGF', { send_page_view: false });
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-L6KM3R8YGF"></script>
